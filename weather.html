<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Dashboard</title>
  <style>
    :root { --bg:#cfe8f7; --fg:#12303f; --card:rgba(255,255,255,.55); --accent:#0b6fa4; }
    body[data-theme="clear"] { --bg:#ffd98a; --fg:#3a2a05; --accent:#c2570c; }
    body[data-theme="night"] { --bg:#14213d; --fg:#eef2ff; --card:rgba(255,255,255,.1); --accent:#8ab4ff; }
    body[data-theme="cloud"] { --bg:#d5dbe1; --fg:#25303a; --accent:#4a6275; }
    body[data-theme="rain"]  { --bg:#8fa9bd; --fg:#0d2433; --accent:#0d4c73; }
    body[data-theme="snow"]  { --bg:#eaf3fb; --fg:#1d3347; --accent:#3c7db0; }
    body[data-theme="storm"] { --bg:#3b3f5c; --fg:#f1f1fa; --card:rgba(255,255,255,.1); --accent:#ffd166; }

    [hidden] { display:none !important; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
           font-family: system-ui, "Segoe UI", Roboto, sans-serif; transition: background .4s, color .4s; }
    .app { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
    h1 { margin:0 0 16px; font-size:clamp(1.6rem,5vw,2.4rem); }
    h2, h3 { margin:0 0 8px; }
    form { display:flex; gap:8px; }
    input { flex:1; padding:12px 14px; font-size:1rem; border-radius:8px;
            border:2px solid var(--accent); background:var(--card); color:inherit; }
    button { padding:12px 20px; font-size:1rem; font-weight:600; border:0; border-radius:8px;
             background:var(--accent); color:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #message { min-height:1.5em; margin:8px 0 0; }
    #message.error { font-weight:600; color:#b3261e; }
    section { margin-top:20px; padding:20px; border-radius:16px; background:var(--card); }
    .current { display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
    .current p { margin:4px 0; }
    .icon { font-size:clamp(4rem,16vw,6.5rem); line-height:1; }
    .temp { font-size:clamp(2.6rem,10vw,4rem); font-weight:700; }
    .travel ul { margin:0; padding-left:20px; line-height:1.6; }
    .days { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; }
    .day { display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 8px;
           border-radius:12px; background:var(--card); text-align:center; }
    .icon-sm { font-size:2rem; }
    @media (max-width:480px) { form { flex-direction:column; } }
  </style>
</head>
<body data-theme="clear">
  <main class="app">
    <h1>Weather Dashboard</h1>

    <form id="search-form">
      <input id="city" type="text" placeholder="Search a city, e.g. Chennai" autocomplete="off" aria-label="City name" />
      <button type="submit" id="btn">Search</button>
    </form>
    <p id="message" role="alert"></p>

    <section id="current" class="current" hidden></section>
    <section id="travel" class="travel" hidden></section>
    <section id="forecast" hidden></section>
  </main>

  <script>
    // ---------- Public API: Open-Meteo (no API key needed) ----------
    const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
    const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

    // ---------- Weather codes -> label, icon, theme ----------
    const CODES = [
      { codes:[0],              label:"Clear sky",     day:"☀️", night:"🌙", theme:"clear" },
      { codes:[1,2],            label:"Partly cloudy", day:"⛅", night:"☁️", theme:"cloud" },
      { codes:[3],              label:"Overcast",      day:"☁️", night:"☁️", theme:"cloud" },
      { codes:[45,48],          label:"Fog",           day:"🌫️", night:"🌫️", theme:"cloud" },
      { codes:[51,53,55,56,57], label:"Drizzle",       day:"🌦️", night:"🌧️", theme:"rain" },
      { codes:[61,63,65,66,67], label:"Rain",          day:"🌧️", night:"🌧️", theme:"rain" },
      { codes:[71,73,75,77,85,86], label:"Snow",       day:"❄️", night:"❄️", theme:"snow" },
      { codes:[80,81,82],       label:"Rain showers",  day:"🌧️", night:"🌧️", theme:"rain" },
      { codes:[95,96,99],       label:"Thunderstorm",  day:"⛈️", night:"⛈️", theme:"storm" },
    ];

    function describe(code, isDay = 1) {
      const e = CODES.find(c => c.codes.includes(code)) ?? CODES[2];
      return { label: e.label, icon: isDay ? e.day : e.night,
               theme: e.theme === "clear" && !isDay ? "night" : e.theme };
    }

    function travelTips(code, temp, wind) {
      const { theme } = describe(code);
      const tips = [];
      if (theme === "storm") tips.push("Stay indoors: museums, cafes or a movie are safer today.");
      else if (theme === "rain") tips.push("Carry an umbrella. Good day for indoor sights and local food.");
      else if (theme === "snow") tips.push("Great for snow activities. Wear layers and check road conditions.");
      else if (theme === "clear" || theme === "night") tips.push("Clear skies: ideal for sightseeing and photography.");
      else tips.push("Mild skies: good for walking tours and markets.");

      if (temp >= 35) tips.push("Very hot. Travel early morning or evening, carry water, use sunscreen.");
      else if (temp >= 25) tips.push("Warm weather: light cotton clothes and a hat.");
      else if (temp >= 15) tips.push("Comfortable temperature: perfect for outdoor exploring.");
      else if (temp >= 5) tips.push("Cool: pack a jacket.");
      else tips.push("Cold: thermal wear, gloves and a warm cap recommended.");

      if (wind >= 40) tips.push("Strong winds: avoid boat trips and high viewpoints.");
      return tips;
    }

    // ---------- Helpers ----------
    const $ = id => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } },
    };
    const esc = s => String(s).replace(/[&<>"']/g,
      c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function showMessage(text, isError = false) {
      const el = $("message");
      el.textContent = text;
      el.className = isError ? "error" : "";
    }

    async function getJSON(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      let res;
      try { res = await fetch(url, { signal: ctrl.signal }); }
      finally { clearTimeout(timer); }
      if (!res.ok) throw new Error(`Request failed (HTTP ${res.status}). Please try again.`);
      return res.json();
    }

    // ---------- API calls (async/await) ----------
    async function geocodeCity(input) {
      // Accepts "Chennai" or "Chennai, India" / "Paris, France"
      const [name, hint = ""] = input.split(",").map(p => p.trim());
      const data = await getJSON(`${GEO_URL}?name=${encodeURIComponent(name)}&count=10&language=en`);
      if (!data.results?.length) throw new Error(`City "${input}" not found. Check the spelling.`);
      const h = hint.toLowerCase();
      const match = h
        ? data.results.find(r => [r.country, r.admin1, r.country_code].some(v => v && v.toLowerCase() === h))
        : data.results[0];
      if (!match) throw new Error(`City "${input}" not found. Try just the city name.`);
      const { name: city, country, latitude, longitude } = match;
      return { city, country, latitude, longitude };
    }

    async function getWeather({ latitude, longitude }) {
      const params = new URLSearchParams({
        latitude, longitude,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        timezone: "auto",
        forecast_days: 5,
      });
      return getJSON(`${WEATHER_URL}?${params}`);
    }

    // ---------- Render ----------
    function render(place, data) {
      const { current: c, daily: d } = data;
      const info = describe(c.weather_code, c.is_day);
      document.body.dataset.theme = info.theme;

      $("current").innerHTML = `
        <div class="icon" aria-hidden="true">${info.icon}</div>
        <div>
          <h2>${esc(place.city)}, ${esc(place.country ?? "")}</h2>
          <p class="temp">${Math.round(c.temperature_2m)}°C</p>
          <p>${info.label}, feels like ${Math.round(c.apparent_temperature)}°C</p>
          <p>Humidity ${c.relative_humidity_2m}% | Wind ${Math.round(c.wind_speed_10m)} km/h</p>
        </div>`;

      const tips = travelTips(c.weather_code, c.temperature_2m, c.wind_speed_10m);
      $("travel").innerHTML = `<h3>Travel suggestions</h3><ul>${tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;

      $("forecast").innerHTML = `<h3>5-day forecast</h3><div class="days">` +
        d.time.map((date, i) => {
          const day = new Date(date).toLocaleDateString("en", { weekday:"short", day:"numeric" });
          const w = describe(d.weather_code[i]);
          return `<article class="day">
            <strong>${day}</strong>
            <span class="icon-sm" aria-hidden="true">${w.icon}</span>
            <span>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</span>
            <small>Rain ${d.precipitation_probability_max[i] ?? 0}%</small>
          </article>`;
        }).join("") + `</div>`;

      ["current", "travel", "forecast"].forEach(id => $(id).hidden = false);
    }

    // ---------- Search + validation + error handling ----------
    async function search(name) {
      const city = name.trim();
      if (!city) return showMessage("Please enter a city name.", true);
      if (city.length < 2) return showMessage("City name is too short.", true);
      if (!/[A-Za-z\u00C0-\uFFFF]/.test(city)) return showMessage("City name must contain letters.", true);

      try {
        $("btn").disabled = true;
        showMessage("Loading...");
        const place = await geocodeCity(city);
        const data = await getWeather(place);
        render(place, data);
        showMessage("");
        store.set("lastCity", place.city);
      } catch (err) {
        console.error(err);
        showMessage(
          err.name === "AbortError" ? "Request timed out. Please try again."
          : err instanceof TypeError ? "Network error. Check your internet connection."
          : err.message, true);
      } finally {
        $("btn").disabled = false;
      }
    }

    $("search-form").addEventListener("submit", e => {
      e.preventDefault();
      search($("city").value);
    });

    // Load last searched city (or a default) on start
    const last = store.get("lastCity") ?? "Chennai";
    $("city").value = last;
    search(last);
  </script>
</body>
</html>
